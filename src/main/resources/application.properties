spring.application.name=AGoals

# Base de datos (valores por defecto = docker-compose.yml; se pueden sobreescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/agoals}
spring.datasource.username=${DB_USER:agoals}
spring.datasource.password=${DB_PASSWORD:agoals_dev}

# El esquema lo maneja Flyway (db/migration). Hibernate solo valida que coincida con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
