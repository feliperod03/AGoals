spring.application.name=AGoals

# Base de datos (valores por defecto = docker-compose.yml; se pueden sobreescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/agoals}
spring.datasource.username=${DB_USER:agoals}
spring.datasource.password=${DB_PASSWORD:agoals_dev}

# El esquema lo maneja Flyway (db/migration). Hibernate solo valida que coincida con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sesión y CSRF (L1b). La cookie de sesión es HttpOnly y SameSite=Lax; Secure solo en producción
# (AGOALS_COOKIE_SEGURA=true). La cookie XSRF-TOKEN usa la misma bandera Secure (ver SeguridadConfig).
agoals.seguridad.cookie-segura=${AGOALS_COOKIE_SEGURA:false}
server.servlet.session.cookie.name=AGOALS_SESION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${agoals.seguridad.cookie-segura}

# Remember-me (L2): tokens persistentes en la tabla persistent_logins (V4). Cookie AGOALS_RECORDARME: HttpOnly,
# SameSite=Lax y Secure según agoals.seguridad.cookie-segura. La sesión (30 min) se recrea sola con esa cookie.
agoals.seguridad.recordarme.duracion=${AGOALS_RECORDARME_DURACION:30d}
# Margen para peticiones paralelas que llegan con el token recién rotado: no se toman como robo.
agoals.seguridad.recordarme.gracia=60s

# Freno de intentos fallidos de login (L2), en memoria: por (IP, email) y por IP. Con el bloqueo, 429 sin consultar la base.
# La IP es request.getRemoteAddr(): detrás del proxy de producción hay que configurar la IP real del cliente (ver CLAUDE.md).
agoals.seguridad.login.max-fallos-email=5
agoals.seguridad.login.max-fallos-ip=${AGOALS_LOGIN_MAX_FALLOS_IP:20}
agoals.seguridad.login.ventana=15m
agoals.seguridad.login.bloqueo=15m
agoals.seguridad.login.max-entradas=10000
