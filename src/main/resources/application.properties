spring.application.name=AGoals

# Base de datos (valores por defecto = docker-compose.yml; se pueden sobreescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/agoals}
spring.datasource.username=${DB_USER:agoals}
spring.datasource.password=${DB_PASSWORD:agoals_dev}

# El esquema lo maneja Flyway (db/migration). Hibernate solo valida que coincida con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sesión y CSRF (L1b). La cookie de sesión es HttpOnly y SameSite=Lax; Secure solo en producción
# (AGOALS_COOKIE_SEGURA=true). La cookie XSRF-TOKEN usa la misma bandera Secure (ver SeguridadConfig).
agoals.seguridad.cookie-segura=${AGOALS_COOKIE_SEGURA:false}
server.servlet.session.cookie.name=AGOALS_SESION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${agoals.seguridad.cookie-segura}
